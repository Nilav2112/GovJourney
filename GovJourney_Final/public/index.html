function toast(t){const x=document.getElementById('toast');x.innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>x.innerHTML='',2400)}
function go(r,p={}){S.route=r;Object.assign(S,p);render()}
function setLang(l){STORE.set('lang',l);document.documentElement.lang=l;toast(l==='en'?'Language set to English':l==='hi'?'भाषा हिन्दी में सेट है':'ಭಾಷೆಯನ್ನು ಕನ್ನಡಕ್ಕೆ ಹೊಂದಿಸಲಾಗಿದೆ');}
function updateNav(){const u=!!S.user;document.getElementById('publicNav').classList.toggle('hidden',u);document.getElementById('userNav').classList.toggle('hidden',!u);document.getElementById('loginBtn').classList.toggle('hidden',u);document.getElementById('startBtn').classList.toggle('hidden',u);document.getElementById('profileBtn').classList.toggle('hidden',!u);if(u)document.getElementById('userName').textContent=S.user.name.split(' ')[0]}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function openLogin(){modal(`<div class="modal-head"><h2>Log in</h2><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Email</label><input class="input" id="le" value="demo@govjourney.com"></div><div class="field"><label>Password</label><input class="input" type="password" id="lp" value="Demo@123"></div><div id="lerr" class="notice hidden"></div><button class="btn btn-primary" style="width:100%" onclick="login()">Log in</button><p style="font-size:12px;color:var(--muted);text-align:center">Demo: demo@govjourney.com / Demo@123</p><button class="btn btn-outline" style="width:100%" onclick="openRegister()">Create an account</button>`)}
function openRegister(){modal(`<div class="modal-head"><h2>Create account</h2><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Name</label><input class="input" id="rn"></div><div class="field"><label>Email</label><input class="input" id="re" type="email"></div><div class="field"><label>Mobile</label><input class="input" id="rm"></div><div class="field"><label>Password</label><input class="input" id="rp" type="password"></div><button class="btn btn-primary" style="width:100%" onclick="register()">Create account</button>`)}
function login(){const e=document.getElementById('le').value.trim().toLowerCase(),p=document.getElementById('lp').value;const acc=STORE.get('accounts',[{name:'Demo Citizen',email:'demo@govjourney.com',mobile:'9900000000',password:'Demo@123'}]).find(a=>a.email.toLowerCase()===e&&a.password===p);if(!acc){document.getElementById('lerr').classList.remove('hidden');document.getElementById('lerr').textContent='Invalid credentials.';return}S.user=acc;STORE.set('user',acc);closeModal();toast('Logged in successfully');go('dashboard')}
function register(){const a={name:document.getElementById('rn').value.trim(),email:document.getElementById('re').value.trim().toLowerCase(),mobile:document.getElementById('rm').value.trim(),password:document.getElementById('rp').value};if(!a.name||!a.email||a.password.length<6)return toast('Enter valid details and a 6+ character password.');const acc=STORE.get('accounts',[]);if(acc.some(x=>x.email===a.email))return toast('Email already registered.');acc.push(a);STORE.set('accounts',acc);S.user=a;STORE.set('user',a);closeModal();toast('Account created');go('dashboard')}
function logout(){S.user=null;STORE.set('user',null);go('home')}
function filtered(){return EVENTS.filter(e=>(S.eventFilter==='All'||e.category===S.eventFilter)&&(!S.search||(`${e.name} ${e.description} ${e.category}`.toLowerCase().includes(S.search.toLowerCase()))))}
function startEvent(id){S.activeEvent=id;S.q=0;S.answers=[];go('questions')}
function answer(a){S.answers[S.q]=a;render()}
function nextQ(){if(S.q<ev(S.activeEvent).questions.length-1){S.q++;render()}else generate()}
function generate(){const id=S.activeEvent;let js=journeys().filter(j=>j.eventId!==id);js.push({eventId:id,status:'active',completed:[],answers:S.answers,started:Date.now()});saveJourneys(js);addNotification('🧭','Journey created',`Your ${ev(id).name} journey is ready.`);go('journey',{id});}
function completeStep(id,i){let js=journeys(),j=js.find(x=>x.eventId===id),e=ev(id);if(!j)return;const deps=i===0?[]:[i-1];if(deps.some(d=>!j.completed.includes(d)))return toast('Complete the previous step first.');if(!j.completed.includes(i))j.completed.push(i);if(j.completed.length===e.steps.length)j.status='completed';saveJourneys(js);addNotification('✅','Step completed',e.steps[i].title);render()}
function pct(j,e){return Math.round(j.completed.length/e.steps.length*100)}
function addNotification(icon,title,body){let n=STORE.get('notifications',[]);n.unshift({icon,title,body,read:false,date:new Date().toISOString()});STORE.set('notifications',n)}
function markRead(i){let n=STORE.get('notifications',[]);n[i].read=true;STORE.set('notifications',n);render()}
function removeNotif(i){let n=STORE.get('notifications',[]);n.splice(i,1);STORE.set('notifications',n);render()}
function reminders(){return STORE.get('reminders',[])}
function addReminder(){const t=document.getElementById('rt').value.trim(),d=document.getElementById('rd').value,n=document.getElementById('rn2').value.trim();if(!t||!d)return toast('Enter reminder title and date.');let a=reminders();a.push({id:Date.now(),title:t,due:d,notes:n});STORE.set('reminders',a);addNotification('⏰','Reminder added',t);render()}
function deleteReminder(id){STORE.set('reminders',reminders().filter(x=>x.id!==id));render()}
function calendar(title,date,notes){const d=new Date(date+'T09:00:00');const f=x=>x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//GovJourney//EN\nBEGIN:VEVENT\nUID:${Date.now()}@govjourney\nDTSTAMP:${f(new Date())}\nDTSTART:${f(d)}\nDTEND:${f(new Date(d.getTime()+3600000))}\nSUMMARY:${title}\nDESCRIPTION:${notes||'GovJourney reminder'}\nEND:VEVENT\nEND:VCALENDAR`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='GovJourney_Reminder.ics';a.click();toast('Calendar file created')}
function report(id){const e=ev(id),j=journeys().find(x=>x.eventId===id);const rows=e.steps.map((s,i)=>`${i+1}. ${s.title} — ${j.completed.includes(i)?'Completed':'Pending'}`).join('\n');const txt=`GOVJOURNEY JOURNEY REPORT\n\nCitizen: ${S.user?.name||'Guest'}\nLife Event: ${e.name}\nProgress: ${pct(j,e)}%\nDepartments: ${e.departments.join(', ')}\n\nWORKFLOW\n${rows}\n\nDOCUMENTS\n${e.documents.map(x=>'• '+x).join('\n')}\n\nOfficial portal: ${e.portal[1]}\n\nDemo report — verify requirements on official government portals.`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=e.id+'_GovJourney_Report.txt';a.click();toast('Report downloaded')}
function addVaultFile(cat){const f=document.getElementById('vf').files[0];if(!f)return toast('Choose a file.');if(f.size>2*1024*1024)return toast('For this browser demo, files must be under 2 MB.');const r=new FileReader();r.onload=()=>{let v=STORE.get('vault',[]);v.push({id:Date.now(),cat,name:f.name,type:f.type,data:r.result,size:f.size});STORE.set('vault',v);toast('File saved to your local vault');render()};r.readAsDataURL(f)}
function downloadVault(id){const f=STORE.get('vault',[]).find(x=>x.id===id);if(!f)return;const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function deleteVault(id){STORE.set('vault',STORE.get('vault',[]).filter(x=>x.id!==id));render()}
function render(){updateNav();const a=document.getElementById('app');let h='';if(S.route==='home')h=home();else if(S.route==='how')h=how();else if(S.route==='about')h=about();else if(S.route==='events')h=eventsPage();else if(S.route==='questions')h=questions();else if(S.route==='journey')h=journeyPage(S.id);else if(S.route==='dashboard')h=appShell(dashboard(),'dashboard');else if(S.route==='journeys')h=appShell(myJourneys(),'journeys');else if(S.route==='documents')h=appShell(documents(),'documents');else if(S.route==='offices')h=appShell(offices(),'offices');else if(S.route==='notifications')h=appShell(notifications(),'notifications');else if(S.route==='reminders')h=appShell(remindersPage(),'reminders');else if(S.route==='profile')h=appShell(profile(),'profile');else if(S.route==='admin')h=adminPage();else h=home();a.innerHTML=h;}
function home(){return `<section class="hero"><div class="container hero-grid"><div><span class="eyebrow">🇮🇳 Civic-tech • Sustainable computing</span><h1>One life event.<br><span style="color:var(--blue)">One clear journey.</span></h1><p>GovJourney turns scattered government procedures into a simple, personalized action plan with services, documents, dependencies, offices, timelines and progress tracking.</p><div class="hero-actions"><button class="btn btn-primary" onclick="go('events')">Explore Life Events →</button><button class="btn btn-outline" onclick="go('how')">See How It Works</button></div></div><div class="hero-card"><div style="font-weight:800;color:var(--navy);margin-bottom:16px">Your government action plan</div><div class="road"><div class="road-item"><div class="road-dot">1</div><div><b>Choose a life event</b><div style="font-size:12px;color:var(--muted)">Marriage, business, travel, education & more</div></div></div><div class="road-item"><div class="road-dot">2</div><div><b>Answer simple questions</b><div style="font-size:12px;color:var(--muted)">Personalize your route</div></div></div><div class="road-item"><div class="road-dot">3</div><div><b>Follow your roadmap</b><div style="font-size:12px;color:var(--muted)">Dependencies, documents & offices</div></div></div><div class="road-item"><div class="road-dot">4</div><div><b>Track & finish</b><div style="font-size:12px;color:var(--muted)">Progress, reminders and report</div></div></div></div></div></div></section><section class="section"><div class="container"><div class="section-head"><div><h2>Built around real life</h2><p>More than 10 life events are available from day one.</p></div><button class="btn btn-outline" onclick="go('events')">View all ${EVENTS.length} events</button></div><div class="grid-3">${EVENTS.slice(0,6).map(eventCard).join('')}</div></div></section><section class="section" style="padding-top:10px"><div class="container"><div class="feature-grid"><div class="card feature"><div class="ico">🧭</div><h3>Smart Roadmaps</h3><p style="color:var(--muted)">Step-by-step journeys with dependencies.</p></div><div class="card feature"><div class="ico">📄</div><h3>Document Vault</h3><p style="color:var(--muted)">Keep personal copies organized locally.</p></div><div class="card feature"><div class="ico">🔔</div><h3>Reminders</h3><p style="color:var(--muted)">Create deadlines and calendar files.</p></div><div class="card feature"><div class="ico">🌐</div><h3>Official Links</h3><p style="color:var(--muted)">Jump to relevant government portals.</p></div></div></div></section>${footer()}`}
function eventCard(e){return `<div class="card event"><div class="event-icon" style="background:${e.color}18">${e.icon}</div><span class="cat">${e.category}</span><h3>${e.name}</h3><p>${e.description}</p><div class="event-meta">🧩 ${e.steps.length} steps • ⏱ ${e.duration}</div><button class="btn btn-primary" onclick="startEvent('${e.id}')">Start Journey</button></div>`}
function eventsPage(){return `<div class="page-head"><div class="container"><h1>Life Events</h1><p>Choose what is happening in your life. GovJourney will build the route.</p></div></div><section class="section" style="padding-top:30px"><div class="container"><div class="event-tools"><div class="search"><span>🔎</span><input class="input" placeholder="Search life events, services or categories..." value="${S.search.replace(/"/g,'&quot;')}" oninput="S.search=this.value;render()"></div></div><div class="chips">${CATS.map(c=>`<button class="chip ${S.eventFilter===c?'active':''}" onclick="S.eventFilter='${c}';render()">${c}</button>`).join('')}</div><div class="grid-3">${filtered().map(eventCard).join('')}</div>${!filtered().length?'<div class="empty">No life events match your search.</div>':''}</div></section>${footer()}`}
function questions(){const e=ev(S.activeEvent),q=e.questions[S.q];return `<div class="page-head"><div class="container"><h1>${e.icon} ${e.name}</h1><p>Personalize your journey in ${e.questions.length} quick questions.</p></div></div><section class="section"><div class="container" style="max-width:760px"><div class="card"><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:13px"><b>Question ${S.q+1} of ${e.questions.length}</b><span>${Math.round(S.q/e.questions.length*100)}%</span></div><div class="progressbar" style="margin:9px 0 25px"><div class="fill" style="width:${S.q/e.questions.length*100}%"></div></div><h2 style="color:var(--navy)">${q}</h2>${['Yes','No','Not sure'].map(x=>`<button class="question-option ${S.answers[S.q]===x?'selected':''}" onclick="answer('${x}')">${S.answers[S.q]===x?'●':'○'} ${x}</button>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:24px"><button class="btn btn-outline" onclick="S.q=Math.max(0,S.q-1);render()" ${S.q===0?'disabled':''}>← Back</button><button class="btn btn-primary" onclick="nextQ()" ${!S.answers[S.q]?'disabled':''}>${S.q===e.questions.length-1?'Generate My Journey':'Continue →'}</button></div></div></div></section>`}
function journeyPage(id){const e=ev(id),j=journeys().find(x=>x.eventId===id);if(!e||!j)return `<div class="empty">Journey not found.</div>`;const p=pct(j,e);return `<section class="section"><div class="container" style="max-width:850px"><div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><span class="badge ${j.status==='completed'?'done':'current'}">${j.status}</span><h1 style="color:var(--navy);margin:8px 0">${e.icon} ${e.name} Journey</h1><p style="color:var(--muted)">${e.departments.join(' • ')}</p></div><b style="font-size:28px;color:var(--blue)">${p}%</b></div><div class="progressbar"><div class="fill" style="width:${p}%"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:17px"><button class="btn btn-outline btn-sm" onclick="report('${id}')">⬇ Report</button><button class="btn btn-outline btn-sm" onclick="go('documents')">📄 Documents</button><button class="btn btn-outline btn-sm" onclick="go('offices')">📍 Offices</button><button class="btn btn-outline btn-sm" onclick="go('reminders')">⏰ Reminders</button><a class="btn btn-primary btn-sm" href="${e.portal[1]}" target="_blank" rel="noopener">🌐 Official Portal</a></div></div><div class="timeline">${e.steps.map((s,i)=>{const done=j.completed.includes(i),locked=i>0&&!j.completed.includes(i-1);return `<div class="step ${done?'done':(!locked?'current':'')}" ><div class="step-dot">${done?'✓':locked?'🔒':i+1}</div><h3>${s.title}</h3><p>${s.desc}</p><div style="margin-top:7px;font-size:12px;color:var(--muted)">Department: ${s.dept}</div><div style="margin-top:9px"><span class="badge ${done?'done':locked?'locked':'current'}">${done?'Completed':locked?'Locked':'Current'}</span>${!done&&!locked?` <button class="btn btn-primary btn-sm" onclick="completeStep('${id}',${i})" style="margin-left:6px">Mark complete</button>`:''}</div></div>`}).join('')}</div><div class="grid-2"><div class="card"><h3 style="color:var(--navy)">Documents</h3>${e.documents.map(d=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">📄 ${d}</div>`).join('')}</div><div class="card"><h3 style="color:var(--navy)">Departments & dependencies</h3><div class="pill-list">${e.departments.map(d=>`<span class="chip active">${d}</span>`).join('')}</div><p style="font-size:13px;color:var(--muted);margin-top:15px">Steps unlock in order so important prerequisites are completed first.</p></div></div></div></section>`}
function appShell(content,active){const items=[['dashboard','📊','Dashboard'],['events','🗂️','Life Events'],['journeys','🧭','My Journeys'],['documents','📄','Documents'],['offices','📍','Office Locator'],['notifications','🔔','Notifications'],['reminders','⏰','Reminders'],['profile','👤','Profile']];return `<div class="app-layout"><aside class="side"><h4>Workspace</h4>${items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}<h4>Administration</h4><button onclick="go('admin')">⚙️ Admin Console</button><button onclick="logout()">🚪 Log out</button></aside><section class="main">${content}</section></div>`}
function dashboard(){const js=journeys(),a=js.filter(x=>x.status==='active'),c=js.filter(x=>x.status==='completed'),n=STORE.get('notifications',[]).filter(x=>!x.read).length;return `<div class="section-head"><div><h2>Good day, ${S.user?.name?.split(' ')[0]||'Citizen'} 👋</h2><p>Your government action plan in one place.</p></div><button class="btn btn-primary" onclick="go('events')">+ New Journey</button></div><div class="stats"><div class="stat"><b>${a.length}</b><span>Active journeys</span></div><div class="stat"><b>${c.length}</b><span>Completed journeys</span></div><div class="stat"><b>${n}</b><span>Unread notifications</span></div><div class="stat"><b>${EVENTS.length}</b><span>Life events available</span></div></div><h3 style="color:var(--navy);margin-top:28px">Continue your journeys</h3>${a.length? a.map(j=>{const e=ev(j.eventId);return `<div class="journey-card"><div><span class="badge current">Active</span><h3 style="margin:7px 0;color:var(--navy)">${e.icon} ${e.name}</h3><p style="margin:0;color:var(--muted);font-size:13px">${j.completed.length}/${e.steps.length} steps complete</p></div><div><div class="track"><div class="fill" style="width:${pct(j,e)}%"></div></div><button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="go('journey',{id:'${e.id}'})">Continue</button></div></div>`}).join(''):'<div class="empty card">No active journeys yet. Start one from Life Events.</div>'}<h3 style="color:var(--navy);margin-top:28px">Quick access</h3><div class="feature-grid"><div class="card feature" onclick="go('documents')">📄 <b>Documents</b><p style="color:var(--muted)">Checklist + local vault</p></div><div class="card feature" onclick="go('offices')">📍 <b>Office Locator</b><p style="color:var(--muted)">Search departments</p></div><div class="card feature" onclick="go('reminders')">⏰ <b>Reminders</b><p style="color:var(--muted)">Deadlines + calendar</p></div><div class="card feature" onclick="go('notifications')">🔔 <b>Notifications</b><p style="color:var(--muted)">${n} unread</p></div></div>`}
function myJourneys(){const js=journeys();return `<div class="section-head"><div><h2>My Journeys</h2><p>All your saved life-event roadmaps.</p></div></div>${js.length?js.map(j=>{const e=ev(j.eventId);return `<div class="journey-card"><div><span class="badge ${j.status==='completed'?'done':'current'}">${j.status}</span><h3 style="margin:7px 0;color:var(--navy)">${e.icon} ${e.name}</h3><p style="margin:0;color:var(--muted);font-size:13px">Started ${new Date(j.started).toLocaleDateString()}</p></div><div><div class="track"><div class="fill" style="width:${pct(j,e)}%"></div></div><button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="go('journey',{id:'${e.id}'})">View Journey</button></div></div>`}).join(''):'<div class="empty card">No journeys saved yet.</div>'}`}
function documents(){const cats=['Identity','Address','Family','Education','Employment','Property','Travel','Other'];const v=STORE.get('vault',[]);return `<div class="section-head"><div><h2>Documents</h2><p>Checklist and digital document vault.</p></div></div><div class="notice">Your vault is stored in this browser for the academic prototype. Do not use it for sensitive production documents.</div><div class="grid-2" style="margin-top:16px"><div class="card"><h3 style="color:var(--navy)">Common checklist</h3>${['Aadhaar Card','PAN Card','Address Proof','Passport-size Photo','Birth/Marriage Certificate'].map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)"><span>📄 ${x}</span><button class="btn btn-outline btn-sm" onclick="toast('Checklist item marked ready')">Mark ready</button></div>`).join('')}</div><div class="card"><h3 style="color:var(--navy)">Upload to Vault</h3><div class="field"><label>Category</label><select class="select" id="vc">${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><input class="input" type="file" id="vf" accept=".pdf,.png,.jpg,.jpeg,.txt"><button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="addVaultFile(document.getElementById('vc').value)">Upload File</button><p style="font-size:12px;color:var(--muted)">Maximum 2 MB per file in this browser demo.</p></div></div><h3 style="color:var(--navy);margin-top:28px">My Vault (${v.length})</h3>${v.length?v.map(f=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div>📎 <b>${f.name}</b><div style="font-size:12px;color:var(--muted)">${f.cat} • ${(f.size/1024).toFixed(0)} KB</div></div><div style="display:flex;gap:6px"><button class="btn btn-outline btn-sm" onclick="downloadVault(${f.id})">Download</button><button class="btn btn-danger btn-sm" onclick="deleteVault(${f.id})">Delete</button></div></div>`).join(''):'<div class="empty card">No files in your vault yet.</div>'}`}
function offices(){return `<div class="section-head"><div><h2>Office Locator</h2><p>Search departments and open directions in Google Maps.</p></div></div><div class="event-tools"><input class="input" id="os" placeholder="Search office or department..." oninput="filterOffices(this.value)"></div><div class="map">${OFFICES.map((o,i)=>`<span class="pin" style="left:${12+i*15}%;top:${30+(i%3)*28}%">📍</span>`).join('')}</div><div id="officeList" style="margin-top:18px">${officeCards(OFFICES)}</div>`}
function officeCards(list){return list.map(o=>`<div class="card office" style="margin-bottom:10px"><div><b style="color:var(--navy)">${o.name}</b><div style="font-size:13px;color:var(--muted);margin-top:4px">${o.dept} • ${o.address}</div><div style="font-size:12px;color:var(--muted);margin-top:4px">${o.timings} • ${o.phone}</div></div><a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.name+' '+o.address)}">Directions</a></div>`).join('')||'<div class="empty card">No offices found.</div>'}
function filterOffices(q){const l=OFFICES.filter(o=>(o.name+' '+o.dept+' '+o.address).toLowerCase().includes(q.toLowerCase()));document.getElementById('officeList').innerHTML=officeCards(l)}
function notifications(){const n=STORE.get('notifications',[]);return `<div class="section-head"><div><h2>Notifications</h2><p>Journey updates, reminders and action alerts.</p></div><button class="btn btn-outline" onclick="STORE.set('notifications',[]);render()">Clear all</button></div>${n.length?n.map((x,i)=>`<div class="card" style="display:flex;gap:12px;align-items:start;margin-bottom:9px"><div style="font-size:22px">${x.icon}</div><div style="flex:1"><b>${x.title}</b><p style="margin:4px 0;color:var(--muted);font-size:13px">${x.body}</p><span style="font-size:11px;color:#98a2b3">${new Date(x.date).toLocaleString()}</span></div><div>${!x.read?`<button class="btn btn-outline btn-sm" onclick="markRead(${i})">Mark read</button>`:''}<button class="btn btn-danger btn-sm" onclick="removeNotif(${i})">Delete</button></div></div>`).join(''):'<div class="empty card">You are all caught up.</div>'}`}
function remindersPage(){const r=reminders();return `<div class="section-head"><div><h2>Reminders & Calendar</h2><p>Personalized reminders with downloadable calendar events.</p></div></div><div class="grid-2"><div class="card"><h3 style="color:var(--navy)">Create reminder</h3><div class="field"><label>Title</label><input class="input" id="rt" placeholder="Passport appointment"></div><div class="field"><label>Date</label><input class="input" type="date" id="rd"></div><div class="field"><label>Notes</label><textarea class="textarea" id="rn2" rows="3" placeholder="Bring original documents"></textarea></div><button class="btn btn-primary" onclick="addReminder()">Add Reminder</button></div><div class="card"><h3 style="color:var(--navy)">Upcoming reminders</h3>${r.length?r.map(x=>`<div class="reminder-row"><div><b>${x.title}</b><div style="font-size:12px;color:var(--muted)">${x.due}${x.notes?' • '+x.notes:''}</div></div><div><button class="btn btn-outline btn-sm" onclick="calendar('${x.title.replace(/'/g,'')}', '${x.due}', '${(x.notes||'').replace(/'/g,'')}')">Calendar</button><button class="btn btn-danger btn-sm" onclick="deleteReminder(${x.id})">Delete</button></div></div>`).join(''):'<p style="color:var(--muted)">No reminders yet.</p>'}</div></div>`}
function profile(){return `<div class="section-head"><div><h2>Profile</h2><p>Manage your citizen profile and preferences.</p></div></div><div class="card" style="max-width:700px"><div class="form-grid"><div class="field"><label>Name</label><input class="input" id="pn" value="${S.user?.name||''}"></div><div class="field"><label>Mobile</label><input class="input" id="pm" value="${S.user?.mobile||''}"></div><div class="field full"><label>Email</label><input class="input" value="${S.user?.email||''}" disabled></div><div class="field"><label>Preferred language</label><select class="select" id="pl"><option value="en">English</option><option value="hi">Hindi</option><option value="kn">Kannada</option></select></div><div class="field"><label>Notifications</label><select class="select"><option>Enabled</option><option>Disabled</option></select></div></div><button class="btn btn-primary" onclick="S.user.name=document.getElementById('pn').value;S.user.mobile=document.getElementById('pm').value;STORE.set('user',S.user);toast('Profile saved');updateNav()">Save Profile</button></div>`}
function adminPage(){const js=journeys(),counts={};EVENTS.forEach(e=>counts[e.category]=0);js.forEach(j=>{const e=ev(j.eventId);if(e)counts[e.category]++});return `<div class="admin-nav"><b>GovJourney Admin Console</b><button class="btn btn-outline btn-sm" onclick="go('dashboard')">Back to app</button></div><div class="main"><div class="section-head"><div><h2>Admin Dashboard</h2><p>Manage events and view platform analytics.</p></div><button class="btn btn-primary" onclick="addCustomEvent()">+ Add Life Event</button></div><div class="stats"><div class="stat"><b>${EVENTS.length}</b><span>Life Events</span></div><div class="stat"><b>${Object.keys(counts).length}</b><span>Categories</span></div><div class="stat"><b>${js.length}</b><span>Saved Journeys</span></div><div class="stat"><b>${STORE.get('accounts',[]).length}</b><span>Registered Users</span></div></div><div class="grid-2" style="margin-top:20px"><div class="card chart-card"><h3 style="color:var(--navy)">Journeys by Category</h3><canvas id="catChart"></canvas></div><div class="card"><h3 style="color:var(--navy)">Life Event Catalogue</h3><div style="max-height:360px;overflow:auto">${EVENTS.map((e,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${e.icon} ${e.name}<small style="color:var(--muted)"> • ${e.category}</small></span><button class="btn btn-danger btn-sm" onclick="removeEvent('${e.id}')">Remove</button></div>`).join('')}</div></div></div></div>`}
function addCustomEvent(){modal(`<div class="modal-head"><h2>Add Life Event</h2><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Name</label><input class="input" id="ae1"></div><div class="field"><label>Category</label><input class="input" id="ae2" value="Other"></div><div class="field"><label>Icon</label><input class="input" id="ae3" value="📋"></div><div class="field"><label>Description</label><textarea class="textarea" id="ae4"></textarea></div><button class="btn btn-primary" style="width:100%" onclick="saveCustomEvent()">Add Event</button>`)}
function saveCustomEvent(){const n=document.getElementById('ae1').value.trim();if(!n)return toast('Enter event name.');const e={id:'custom-'+Date.now(),name:n,category:document.getElementById('ae2').value||'Other',icon:document.getElementById('ae3').value||'📋',description:document.getElementById('ae4').value||'Custom life event.',duration:'Flexible',documents:['Identity proof','Address proof'],departments:['Relevant Government Department'],portal:['India.gov.in','https://www.india.gov.in/'],questions:['Is this your required life event?','Do you have your identity proof?','Do you need office assistance?','Would you like reminders?'],steps:[{title:'Prepare documents',desc:'Collect the basic supporting documents.',dept:'Relevant Government Department'},{title:'Submit application',desc:'Complete the applicable official process.',dept:'Relevant Government Department'},{title:'Complete verification',desc:'Keep acknowledgement and respond to requests.',dept:'Relevant Government Department'},{title:'Track outcome',desc:'Monitor the official status.',dept:'Relevant Government Department'}]};EVENTS.push(e);if(!CATS.includes(e.category))CATS.push(e.category);closeModal();toast('Life event added');render()}
function removeEvent(id){const i=EVENTS.findIndex(e=>e.id===id);if(i>=0){EVENTS.splice(i,1);toast('Life event removed');render()}}
function how(){return `<div class="page-head"><div class="container"><h1>How GovJourney Works</h1><p>A clear flow from life event to completed government action.</p></div></div><section class="section"><div class="container grid-2"><div class="card"><h2 style="color:var(--navy)">1. Select</h2><p style="color:var(--muted);line-height:1.7">Choose one of the available life events. Search and categories make discovery simple.</p></div><div class="card"><h2 style="color:var(--navy)">2. Personalize</h2><p style="color:var(--muted);line-height:1.7">Answer short questions so the roadmap matches your situation.</p></div><div class="card"><h2 style="color:var(--navy)">3. Follow dependencies</h2><p style="color:var(--muted);line-height:1.7">Important prerequisites unlock the next action in sequence.</p></div><div class="card"><h2 style="color:var(--navy)">4. Track & act</h2><p style="color:var(--muted);line-height:1.7">Use documents, office directions, reminders, notifications and reports.</p></div></div></section>${footer()}`}
function about(){return `<div class="page-head"><div class="container"><h1>About GovJourney</h1><p>Citizen-first navigation for fragmented government services.</p></div></div><section class="section"><div class="container" style="max-width:850px"><div class="card"><p style="font-size:17px;line-height:1.8;color:var(--muted)">GovJourney is an academic civic-tech prototype that organizes government procedures around life events rather than departments. It demonstrates sustainable, understandable digital service navigation through a responsive web interface, local-first saved data, reusable workflows and lightweight client-side features.</p><div class="grid-2"><div><h3 style="color:var(--navy)">Included</h3><p style="color:var(--muted)">18+ events, multilingual UI, voice, chatbot, reminders, document vault, office locator, reports, PWA/offline support and admin analytics.</p></div><div><h3 style="color:var(--navy)">Important</h3><p style="color:var(--muted)">This is not an official government service. Always verify current requirements on the linked official portal.</p></div></div></div></div></section>${footer()}`}
function footer(){return `<footer class="footer"><div class="container footer-grid"><div><h3>GovJourney</h3><p style="line-height:1.6;font-size:13px">One Life Event. One Personalized Government Action Plan.</p></div><div><h4>Explore</h4><a href="#" onclick="go('events');return false">Life Events</a><a href="#" onclick="go('how');return false">How It Works</a></div><div><h4>Tools</h4><a href="#" onclick="go('offices');return false">Office Locator</a><a href="#" onclick="go('documents');return false">Document Vault</a></div><div><h4>Demo</h4><a href="#" onclick="go('admin');return false">Admin Console</a><a href="https://www.india.gov.in/" target="_blank">India.gov.in</a></div></div><div class="container" style="border-top:1px solid #29425f;margin-top:25px;padding-top:18px;font-size:11px">© 2026 GovJourney • Academic prototype • Verify requirements on official government websites.</div></footer>`}
function initSeed(){if(!STORE.get('accounts'))STORE.set('accounts',[{name:'Demo Citizen',email:'demo@govjourney.com',mobile:'9900000000',password:'Demo@123'}]);if(!STORE.get('notifications'))STORE.set('notifications',[{icon:'🔔',title:'Welcome to GovJourney',body:'Start a life-event journey to generate your roadmap.',read:false,date:new Date().toISOString()}]);if(!STORE.get('reminders'))STORE.set('reminders',[]);if(!STORE.get('vault'))STORE.set('vault',[])}
function toggleChat(){document.getElementById('chatPanel').classList.toggle('show');if(!document.getElementById('chatBody').children.length)bot('Hi! I can help you find a life event, documents, offices or reminders.')}
function bot(t){document.getElementById('chatBody').insertAdjacentHTML('beforeend',`<div class="msg bot">${t}</div>`);document.getElementById('chatBody').scrollTop=99999}
function usermsg(t){document.getElementById('chatBody').insertAdjacentHTML('beforeend',`<div class="msg user">${t}</div>`)}
function sendChat(){const i=document.getElementById('chatInput'),t=i.value.trim();if(!t)return;usermsg(t);i.value='';setTimeout(()=>{const q=t.toLowerCase();let r='Open Life Events and choose the closest match. I can then guide you through documents, steps and offices.';const e=EVENTS.find(x=>q.includes(x.name.toLowerCase().split(' ')[0]));if(e)r=`Try <b>${e.name}</b>. It has ${e.steps.length} steps, ${e.documents.length} document types and links to ${e.portal[0]}.`;else if(q.includes('document'))r='Open Documents to use the checklist and local digital vault.';else if(q.includes('office'))r='Open Office Locator to search departments and get map directions.';else if(q.includes('reminder'))r='Open Reminders to create a deadline and export an .ics calendar file.';bot(r)},300)}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice recognition is not supported in this browser.');const r=new R();r.lang='en-IN';r.onstart=()=>toast('Listening…');r.onresult=e=>{const t=e.results[0][0].transcript;toast('Heard: '+t);document.getElementById('chatPanel').classList.add('show');usermsg(t);document.getElementById('chatInput').value=t;sendChat()};r.start()}
window.addEventListener('online',()=>document.getElementById('offline').classList.add('hidden'));window.addEventListener('offline',()=>document.getElementById('offline').classList.remove('hidden'));
initSeed();S.user=STORE.get('user',null);render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
