function iconSvg(name,label=''){const key=ICONS[name] ? name : 'default'; return `<span class="ui-icon" title="${label||name}" aria-label="${label||name}">${ICONS[key]}</span>`; }
function iconText(name,label=''){ return iconSvg(name,label); }
function iconBadge(name,label=''){const key=String(name||'').toLowerCase(); if(ICONS[key]) return iconSvg(key,label||key); return iconSvg('default',label||'Item'); }
const STORE={get(k,d){try{return JSON.parse(localStorage.getItem('gj2_'+k))??d}catch{return d}},set(k,v){localStorage.setItem('gj2_'+k,JSON.stringify(v))}};
async function api(path,options={}){const token=STORE.get('token','');const headers={...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(token?{Authorization:`Bearer ${token}`}:{ }),...(options.headers||{})};const response=await fetch(path,{...options,headers});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed.');return data}

function go(r,p={}){S.route=r;Object.assign(S,p);render()}
function activeLanguage(){const value=new URLSearchParams(window.location.search).get('lang');return ['en','hi','kn'].includes(value)?value:STORE.get('lang','en')}

function closeModal(){document.getElementById('modalBg').classList.remove('show')}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function openLogin(){modal(`<div class="modal-head"><h2>Log in</h2><button class="close" onclick="closeModal()">${iconSvg('close','Close')}</button></div><div class="field"><label>Email</label><input class="input" id="le" value="demo@govjourney.com"></div><div class="field"><label>Password</label><input class="input" type="password" id="lp" value="Demo@123"></div><div id="lerr" class="notice hidden"></div><button class="btn btn-primary" style="width:100%" onclick="login()">Log in</button><p style="font-size:12px;color:var(--muted);text-align:center">Demo: demo@govjourney.com / Demo@123</p><button class="btn btn-outline" style="width:100%" onclick="openRegister()">Create an account</button>`) }
function openRegister(){modal(`<div class="modal-head"><h2>Create account</h2><button class="close" onclick="closeModal()">${iconSvg('close','Close')}</button></div><div class="field"><label>Name</label><input class="input" id="rn"></div><div class="field"><label>Email</label><input class="input" id="re" type="email"></div><div class="field"><label>Mobile</label><input class="input" id="rm"></div><div class="field"><label>Password</label><input class="input" id="rp" type="password"></div><button class="btn btn-primary" style="width:100%" onclick="register()">Create account</button>`) }
async function login(){const e=document.getElementById('le').value.trim().toLowerCase(),p=document.getElementById('lp').value;try{const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:e,password:p})});S.user=data.user;STORE.set('user',data.user);STORE.set('token',data.token);await syncRemoteData();closeModal();toast('Logged in successfully');go('dashboard')}catch(error){document.getElementById('lerr').classList.remove('hidden');document.getElementById('lerr').textContent=error.message}}
async function register(){const a={name:document.getElementById('rn').value.trim(),email:document.getElementById('re').value.trim().toLowerCase(),mobile:document.getElementById('rm').value.trim(),password:document.getElementById('rp').value};if(!a.name||!a.email||a.password.length<8)return toast('Enter valid details and an 8+ character password.');try{const data=await api('/api/auth/register',{method:'POST',body:JSON.stringify(a)});S.user=data.user;STORE.set('user',data.user);STORE.set('token',data.token);closeModal();toast('Account created');go('dashboard')}catch(error){toast(error.message)}}
function logout(){S.user=null;STORE.set('user',null);STORE.set('token','');go('home')}
function filtered(){return EVENTS.filter(e=>(S.eventFilter==='All'||e.category===S.eventFilter)&&(!S.search||(`${e.name} ${e.description} ${e.category}`.toLowerCase().includes(S.search.toLowerCase()))))}
function startEvent(id){S.activeEvent=id;S.q=0;S.answers=[];generate()}
function answer(a){S.answers[S.q]=a;render()}
function nextQ(){if(S.q<ev(S.activeEvent).questions.length-1){S.q++;render()}else generate()}
async function generate(){const id=S.activeEvent;let js=journeys().filter(j=>j.eventId!==id);const localJourney={eventId:id,status:'active',completed:[],answers:S.answers,started:Date.now()};try{const data=await api('/api/journeys',{method:'POST',body:JSON.stringify({eventId:id,answers:S.answers})});localJourney.id=data.journey.id;localJourney.started=data.journey.created_at||localJourney.started}catch(error){toast('Saved locally. Server sync unavailable.')}js.push(localJourney);saveJourneys(js);addNotification('route','Journey created',`Your ${ev(id).name} journey is ready.`);go('journey',{id});}
async function completeStep(id,i){let js=journeys(),j=js.find(x=>x.eventId===id),e=ev(id);if(!j)return;const deps=i===0?[]:[i-1];if(deps.some(d=>!j.completed.includes(d)))return toast('Complete the previous step first.');if(!j.completed.includes(i))j.completed.push(i);if(j.completed.length===e.steps.length)j.status='completed';saveJourneys(js);if(j.id)try{await api(`/api/journeys/${j.id}`,{method:'PUT',body:JSON.stringify({completed_steps:j.completed,status:j.status})})}catch(error){toast('Progress saved locally. Server sync unavailable.')}addNotification('check','Step completed',e.steps[i].title);render()}
function pct(j,e){return Math.round(j.completed.length/e.steps.length*100)}
function addNotification(icon,title,body){let n=STORE.get('notifications',[]);n.unshift({icon,title,body,read:false,date:new Date().toISOString()});STORE.set('notifications',n)}
function markRead(i){let n=STORE.get('notifications',[]);n[i].read=true;STORE.set('notifications',n);render()}
function removeNotif(i){let n=STORE.get('notifications',[]);n.splice(i,1);STORE.set('notifications',n);render()}
function reminders(){return STORE.get('reminders',[])}
async function addReminder(){const t=document.getElementById('rt').value.trim(),d=document.getElementById('rd').value,n=document.getElementById('rn2').value.trim();if(!t||!d)return toast('Enter reminder title and date.');let reminder={id:Date.now(),title:t,due:d,notes:n};try{const data=await api('/api/reminders',{method:'POST',body:JSON.stringify({title:t,due_at:d,notes:n})});reminder={...reminder,id:data.reminder.id}}catch(error){toast('Saved locally. Server sync unavailable.')}let a=reminders();a.push(reminder);STORE.set('reminders',a);addNotification('reminders','Reminder added',t);render()}
async function deleteReminder(id){try{await api(`/api/reminders/${id}`,{method:'DELETE'})}catch(error){}STORE.set('reminders',reminders().filter(x=>x.id!==id));render()}
function calendar(title,date,notes){const d=new Date(date+'T09:00:00');const f=x=>x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//GovJourney//EN\nBEGIN:VEVENT\nUID:${Date.now()}@govjourney\nDTSTAMP:${f(new Date())}\nDTSTART:${f(d)}\nDTEND:${f(new Date(d.getTime()+3600000))}\nSUMMARY:${title}\nDESCRIPTION:${notes||'GovJourney reminder'}\nEND:VEVENT\nEND:VCALENDAR`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='GovJourney_Reminder.ics';a.click();toast('Calendar file created')}
function report(id){const e=ev(id),j=journeys().find(x=>x.eventId===id);const rows=e.steps.map((s,i)=>`${i+1}. ${s.title} — ${j.completed.includes(i)?'Completed':'Pending'}`).join('\n');const txt=`GOVJOURNEY JOURNEY REPORT\n\nCitizen: ${S.user?.name||'Guest'}\nLife Event: ${e.name}\nProgress: ${pct(j,e)}%\nDepartments: ${e.departments.join(', ')}\n\nWORKFLOW\n${rows}\n\nDOCUMENTS\n${e.documents.map(x=>'• '+x).join('\n')}\n\nOfficial portal: ${e.portal[1]}\n\nDemo report — verify requirements on official government portals.`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=e.id+'_GovJourney_Report.txt';a.click();toast('Report downloaded')}
async function addVaultFile(cat){const f=document.getElementById('vf').files[0];if(!f)return toast('Choose a file.');if(f.size>2*1024*1024)return toast('Files must be under 2 MB.');const saveLocal=(message)=>{const r=new FileReader();r.onload=()=>{let v=STORE.get('vault',[]);v.push({id:Date.now(),cat,name:f.name,type:f.type,data:r.result,size:f.size});STORE.set('vault',v);toast(message);render()};r.readAsDataURL(f)};const form=new FormData();form.append('category',cat);form.append('document',f);try{await api('/api/vault',{method:'POST',body:form});saveLocal('Encrypted document saved')}catch(error){saveLocal('Saved locally while the server is unavailable')}}
function downloadVault(id){const f=STORE.get('vault',[]).find(x=>x.id===id);if(!f)return;const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function deleteVault(id){STORE.set('vault',STORE.get('vault',[]).filter(x=>x.id!==id));render()}
function render(){updateNav();const a=document.getElementById('app');let h='';if(S.route==='home')h=home();else if(S.route==='how')h=how();else if(S.route==='about')h=about();else if(S.route==='events')h=eventsPage();else if(S.route==='questions')h=questions();else if(S.route==='journey')h=journeyPage(S.id);else if(S.route==='dashboard')h=appShell(dashboard(),'dashboard');else if(S.route==='journeys')h=appShell(myJourneys(),'journeys');else if(S.route==='documents')h=appShell(documents(),'documents');else if(S.route==='offices')h=appShell(offices(),'offices');else if(S.route==='notifications')h=appShell(notifications(),'notifications');else if(S.route==='reminders')h=appShell(remindersPage(),'reminders');else if(S.route==='profile')h=appShell(profile(),'profile');else if(S.route==='admin')h=adminPage();else h=home();a.innerHTML=h;}
function home(){return `<section class="hero"><div class="container hero-grid"><div><span class="eyebrow">Civic-tech • Sustainable computing</span><h1>One life event.<br><span style="color:var(--blue)">One clear journey.</span></h1><p>GovJourney turns scattered government procedures into a simple, personalized action plan with services, documents, dependencies, offices, timelines and progress tracking.</p><div class="hero-actions"><button class="btn btn-primary" onclick="go('events')">Explore Life Events →</button><button class="btn btn-outline" onclick="go('how')">See How It Works</button></div></div><div class="hero-card"><div style="font-weight:800;color:var(--navy);margin-bottom:16px">Your government action plan</div><div class="road"><div class="road-item"><div class="road-dot">1</div><div><b>Choose a life event</b><div style="font-size:12px;color:var(--muted)">Marriage, business, travel, education & more</div></div></div><div class="road-item"><div class="road-dot">2</div><div><b>Answer simple questions</b><div style="font-size:12px;color:var(--muted)">Personalize your route</div></div></div><div class="road-item"><div class="road-dot">3</div><div><b>Follow your roadmap</b><div style="font-size:12px;color:var(--muted)">Dependencies, documents & offices</div></div></div><div class="road-item"><div class="road-dot">4</div><div><b>Track & finish</b><div style="font-size:12px;color:var(--muted)">Progress, reminders and report</div></div></div></div></div></div></section><section class="section"><div class="container"><div class="section-head"><div><h2>Built around real life</h2><p>More than 10 life events are available from day one.</p></div><button class="btn btn-outline" onclick="go('events')">View all ${EVENTS.length} events</button></div><div class="grid-3">${EVENTS.slice(0,6).map(eventCard).join('')}</div></div></section><section class="section" style="padding-top:10px"><div class="container"><div class="feature-grid"><div class="card feature"><div class="ico">${iconSvg('route','Smart Roadmaps')}</div><h3>Smart Roadmaps</h3><p style="color:var(--muted)">Step-by-step journeys with dependencies.</p></div><div class="card feature"><div class="ico">${iconSvg('documents','Document Vault')}</div><h3>Document Vault</h3><p style="color:var(--muted)">Keep personal copies organized locally.</p></div><div class="card feature"><div class="ico">${iconSvg('reminders','Reminders')}</div><h3>Reminders</h3><p style="color:var(--muted)">Create deadlines and calendar files.</p></div><div class="card feature"><div class="ico">${iconSvg('map','Official Links')}</div><h3>Official Links</h3><p style="color:var(--muted)">Jump to relevant government portals.</p></div></div></div></section>${footer()}`}
function eventCard(e){return `<div class="card event"><div class="event-icon" style="background:${e.color}18">${iconSvg(e.icon,e.name)}</div><span class="cat">${e.category}</span><h3>${e.name}</h3><p>${e.description}</p><div class="event-meta">${e.steps.length} steps • ${e.duration}</div><button class="btn btn-primary" onclick="startEvent('${e.id}')">Start Journey</button></div>`}
function eventsPage(){return `<div class="page-head"><div class="container"><h1>Life Events</h1><p>Choose what is happening in your life. GovJourney will build the route.</p></div></div><section class="section" style="padding-top:30px"><div class="container"><div class="event-tools"><div class="search">${iconSvg('search','Search')}<input class="input" placeholder="Search life events, services or categories..." value="${S.search.replace(/"/g,'&quot;')}" oninput="S.search=this.value;render()"></div></div><div class="chips">${CATS.map(c=>`<button class="chip ${S.eventFilter===c?'active':''}" onclick="S.eventFilter='${c}';render()">${c}</button>`).join('')}</div><div class="grid-3">${filtered().map(eventCard).join('')}</div>${!filtered().length?'<div class="empty">No life events match your search.</div>':''}</div></section>${footer()}`}
function questions(){const e=ev(S.activeEvent),q=e.questions[S.q];return `<div class="page-head"><div class="container"><h1>${iconSvg(e.icon,e.name)} ${e.name}</h1><p>Personalize your journey in ${e.questions.length} quick questions.</p></div></div><section class="section"><div class="container" style="max-width:760px"><div class="card"><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:13px"><b>Question ${S.q+1} of ${e.questions.length}</b><span>${Math.round(S.q/e.questions.length*100)}%</span></div><div class="progressbar" style="margin:9px 0 25px"><div class="fill" style="width:${S.q/e.questions.length*100}%"></div></div><h2 style="color:var(--navy)">${q}</h2>${['Yes','No','Not sure'].map(x=>`<button class="question-option ${S.answers[S.q]===x?'selected':''}" onclick="answer('${x}')">${x}</button>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:24px"><button class="btn btn-outline" onclick="S.q=Math.max(0,S.q-1);render()" ${S.q===0?'disabled':''}>Back</button><button class="btn btn-primary" onclick="nextQ()" ${!S.answers[S.q]?'disabled':''}>${S.q===e.questions.length-1?'Generate My Journey':'Continue'}</button></div></div></div></section>`}
function journeyPage(id){const e=ev(id),j=journeys().find(x=>x.eventId===id);if(!e||!j)return `<div class="empty">Journey not found.</div>`;const p=pct(j,e);return `<section class="section"><div class="container" style="max-width:850px"><div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><span class="badge ${j.status==='completed'?'done':'current'}">${j.status}</span><h1 style="color:var(--navy);margin:8px 0">${e.icon} ${e.name} Journey</h1><p style="color:var(--muted)">${e.departments.join(' • ')}</p></div><b style="font-size:28px;color:var(--blue)">${p}%</b></div><div class="progressbar"><div class="fill" style="width:${p}%"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:17px"><button class="btn btn-outline btn-sm" onclick="report('${id}')">Report</button><button class="btn btn-outline btn-sm" onclick="go('documents')">Documents</button><button class="btn btn-outline btn-sm" onclick="go('offices')">Offices</button><button class="btn btn-outline btn-sm" onclick="go('reminders')">Reminders</button><a class="btn btn-primary btn-sm" href="${e.portal[1]}" target="_blank" rel="noopener">Official Portal</a></div></div><div class="timeline">${e.steps.map((s,i)=>{const done=j.completed.includes(i),locked=i>0&&!j.completed.includes(i-1);return `<div class="step ${done?'done':(!locked?'current':'')}" ><div class="step-dot">${done?iconSvg('check','Completed'):locked?'Locked':i+1}</div><h3>${s.title}</h3><p>${s.desc}</p><div style="margin-top:7px;font-size:12px;color:var(--muted)">Department: ${s.dept}</div><div style="margin-top:9px"><span class="badge ${done?'done':locked?'locked':'current'}">${done?'Completed':locked?'Locked':'Current'}</span>${!done&&!locked?` <button class="btn btn-primary btn-sm" onclick="completeStep('${id}',${i})" style="margin-left:6px">Mark complete</button>`:''}</div></div>`}).join('')}</div><div class="grid-2"><div class="card"><h3 style="color:var(--navy)">Documents</h3>${e.documents.map(d=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">${iconSvg('documents','Document')} ${d}</div>`).join('')}</div><div class="card"><h3 style="color:var(--navy)">Departments & dependencies</h3><div class="pill-list">${e.departments.map(d=>`<span class="chip active">${d}</span>`).join('')}</div><p style="font-size:13px;color:var(--muted);margin-top:15px">Steps unlock in order so important prerequisites are completed first.</p></div></div></div></section>`}
function appShell(content,active){const items=[['dashboard','dashboard','Dashboard'],['events','events','Life Events'],['journeys','journeys','My Journeys'],['documents','documents','Documents'],['offices','offices','Office Locator'],['notifications','notifications','Notifications'],['reminders','reminders','Reminders'],['profile','profile','Profile']];return `<div class="app-layout"><aside class="side"><h4>Workspace</h4>${items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')">${iconSvg(x[1],x[2])} <span>${x[2]}</span></button>`).join('')}<h4>Administration</h4><button onclick="go('admin')">${iconSvg('admin','Admin Console')} Admin Console</button><button onclick="logout()">${iconSvg('close','Log out')} Log out</button></aside><section class="main">${content}</section></div>`}
function dashboard(){const js=journeys(),a=js.filter(x=>x.status==='active'),c=js.filter(x=>x.status==='completed'),n=STORE.get('notifications',[]).filter(x=>!x.read).length;return `<div class="section-head"><div><h2>Good day, ${S.user?.name?.split(' ')[0]||'Citizen'}</h2><p>Your government action plan in one place.</p></div><button class="btn btn-primary" onclick="go('events')">New Journey</button></div><div class="stats"><div class="stat"><b>${a.length}</b><span>Active journeys</span></div><div class="stat"><b>${c.length}</b><span>Completed journeys</span></div><div class="stat"><b>${n}</b><span>Unread notifications</span></div><div class="stat"><b>${EVENTS.length}</b><span>Life events available</span></div></div><h3 style="color:var(--navy);margin-top:28px">Continue your journeys</h3>${a.length? a.map(j=>{const e=ev(j.eventId);return `<div class="journey-card"><div><span class="badge current">Active</span><h3 style="margin:7px 0;color:var(--navy)">${e.icon} ${e.name}</h3><p style="margin:0;color:var(--muted);font-size:13px">${j.completed.length}/${e.steps.length} steps complete</p></div><div><div class="track"><div class="fill" style="width:${pct(j,e)}%"></div></div><button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="go('journey',{id:'${e.id}'})">Continue</button></div></div>`}).join(''):'<div class="empty card">No active journeys yet. Start one from Life Events.</div>'}<h3 style="color:var(--navy);margin-top:28px">Quick access</h3><div class="feature-grid"><div class="card feature" onclick="go('documents')">${iconSvg('documents','Documents')} <b>Documents</b><p style="color:var(--muted)">Checklist + local vault</p></div><div class="card feature" onclick="go('offices')">${iconSvg('offices','Office Locator')} <b>Office Locator</b><p style="color:var(--muted)">Search departments</p></div><div class="card feature" onclick="go('reminders')">${iconSvg('reminders','Reminders')} <b>Reminders</b><p style="color:var(--muted)">Deadlines + calendar</p></div><div class="card feature" onclick="go('notifications')">${iconSvg('notifications','Notifications')} <b>Notifications</b><p style="color:var(--muted)">${n} unread</p></div></div>`}
function myJourneys(){const js=journeys();return `<div class="section-head"><div><h2>My Journeys</h2><p>All your saved life-event roadmaps.</p></div></div>${js.length?js.map(j=>{const e=ev(j.eventId);return `<div class="journey-card"><div><span class="badge ${j.status==='completed'?'done':'current'}">${j.status}</span><h3 style="margin:7px 0;color:var(--navy)">${e.icon} ${e.name}</h3><p style="margin:0;color:var(--muted);font-size:13px">Started ${new Date(j.started).toLocaleDateString()}</p></div><div><div class="track"><div class="fill" style="width:${pct(j,e)}%"></div></div><button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="go('journey',{id:'${e.id}'})">View Journey</button></div></div>`}).join(''):'<div class="empty card">No journeys saved yet.</div>'}`}
function documents(){const cats=['Identity','Address','Family','Education','Employment','Property','Travel','Other'];const v=STORE.get('vault',[]);return `<div class="section-head"><div><h2>Documents</h2><p>Checklist and digital document vault.</p></div></div><div class="notice">Your vault is stored in this browser for the academic prototype. Do not use it for sensitive production documents.</div><div class="grid-2" style="margin-top:16px"><div class="card"><h3 style="color:var(--navy)">Common checklist</h3>${['Aadhaar Card','PAN Card','Address Proof','Passport-size Photo','Birth/Marriage Certificate'].map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)"><span>${iconSvg('documents','Document')} ${x}</span><button class="btn btn-outline btn-sm" onclick="toast('Checklist item marked ready')">Mark ready</button></div>`).join('')}</div><div class="card"><h3 style="color:var(--navy)">Upload to Vault</h3><div class="field"><label>Category</label><select class="select" id="vc">${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><input class="input" type="file" id="vf" accept=".pdf,.png,.jpg,.jpeg,.txt"><button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="addVaultFile(document.getElementById('vc').value)">Upload File</button><p style="font-size:12px;color:var(--muted)">Maximum 2 MB per file in this browser demo.</p></div></div><h3 style="color:var(--navy);margin-top:28px">My Vault (${v.length})</h3>${v.length?v.map(f=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div>${iconSvg('documents','Document')} <b>${f.name}</b><div style="font-size:12px;color:var(--muted)">${f.cat} • ${(f.size/1024).toFixed(0)} KB</div></div><div style="display:flex;gap:6px"><button class="btn btn-outline btn-sm" onclick="downloadVault(${f.id})">Download</button><button class="btn btn-danger btn-sm" onclick="deleteVault(${f.id})">Delete</button></div></div>`).join(''):'<div class="empty card">No files in your vault yet.</div>'}`}
function offices(){return `<div class="section-head"><div><h2>Office Locator</h2><p>Search departments and open directions in Google Maps.</p></div></div><div class="event-tools"><input class="input" id="os" placeholder="Search office or department..." oninput="filterOffices(this.value)"></div><div class="map">${OFFICES.map((o,i)=>`<span class="pin" style="left:${12+i*15}%;top:${30+(i%3)*28}%">${iconSvg('offices','Office')}</span>`).join('')}</div><div id="officeList" style="margin-top:18px">${officeCards(OFFICES)}</div>`}
function officeCards(list){return list.map(o=>`<div class="card office" style="margin-bottom:10px"><div><b style="color:var(--navy)">${o.name}</b><div style="font-size:13px;color:var(--muted);margin-top:4px">${o.dept} • ${o.address}</div><div style="font-size:12px;color:var(--muted);margin-top:4px">${o.timings} • ${o.phone}</div></div><a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.name+' '+o.address)}">Directions</a></div>`).join('')||'<div class="empty card">No offices found.</div>'}
function filterOffices(q){const l=OFFICES.filter(o=>(o.name+' '+o.dept+' '+o.address).toLowerCase().includes(q.toLowerCase()));document.getElementById('officeList').innerHTML=officeCards(l)}
function notifications(){const n=STORE.get('notifications',[]);return `<div class="section-head"><div><h2>Notifications</h2><p>Journey updates, reminders and action alerts.</p></div><button class="btn btn-outline" onclick="STORE.set('notifications',[]);render()">Clear all</button></div>${n.length?n.map((x,i)=>`<div class="card" style="display:flex;gap:12px;align-items:start;margin-bottom:9px"><div style="font-size:22px">${iconBadge(x.icon||'notifications',x.title)}</div><div style="flex:1"><b>${x.title}</b><p style="margin:4px 0;color:var(--muted);font-size:13px">${x.body}</p><span style="font-size:11px;color:#98a2b3">${new Date(x.date).toLocaleString()}</span></div><div>${!x.read?`<button class="btn btn-outline btn-sm" onclick="markRead(${i})">Mark read</button>`:''}<button class="btn btn-danger btn-sm" onclick="removeNotif(${i})">Delete</button></div></div>`).join(''):'<div class="empty card">You are all caught up.</div>'}`}
function remindersPage(){const r=reminders();return `<div class="section-head"><div><h2>Reminders & Calendar</h2><p>Personalized reminders with downloadable calendar events.</p></div></div><div class="grid-2"><div class="card"><h3 style="color:var(--navy)">Create reminder</h3><div class="field"><label>Title</label><input class="input" id="rt" placeholder="Passport appointment"></div><div class="field"><label>Date</label><input class="input" type="date" id="rd"></div><div class="field"><label>Notes</label><textarea class="textarea" id="rn2" rows="3" placeholder="Bring original documents"></textarea></div><button class="btn btn-primary" onclick="addReminder()">Add Reminder</button></div><div class="card"><h3 style="color:var(--navy)">Upcoming reminders</h3>${r.length?r.map(x=>`<div class="reminder-row"><div><b>${x.title}</b><div style="font-size:12px;color:var(--muted)">${x.due}${x.notes?' • '+x.notes:''}</div></div><div><button class="btn btn-outline btn-sm" onclick="calendar('${x.title.replace(/'/g,'')}', '${x.due}', '${(x.notes||'').replace(/'/g,'')}')">Calendar</button><button class="btn btn-danger btn-sm" onclick="deleteReminder(${x.id})">Delete</button></div></div>`).join(''):'<p style="color:var(--muted)">No reminders yet.</p>'}</div></div>`}
function profile(){return `<div class="section-head"><div><h2>Profile</h2><p>Manage your citizen profile and preferences.</p></div></div><div class="card" style="max-width:700px"><div class="form-grid"><div class="field"><label>Name</label><input class="input" id="pn" value="${S.user?.name||''}"></div><div class="field"><label>Mobile</label><input class="input" id="pm" value="${S.user?.mobile||''}"></div><div class="field full"><label>Email</label><input class="input" value="${S.user?.email||''}" disabled></div><div class="field"><label>Preferred language</label><select class="select" id="pl"><option value="en">English</option><option value="hi">Hindi</option><option value="kn">Kannada</option></select></div><div class="field"><label>Notifications</label><select class="select"><option>Enabled</option><option>Disabled</option></select></div></div><button class="btn btn-primary" onclick="S.user.name=document.getElementById('pn').value;S.user.mobile=document.getElementById('pm').value;STORE.set('user',S.user);toast('Profile saved');updateNav()">Save Profile</button></div>`}
function adminPage(){const js=journeys(),counts={};EVENTS.forEach(e=>counts[e.category]=0);js.forEach(j=>{const e=ev(j.eventId);if(e)counts[e.category]++});return `<div class="admin-nav"><b>GovJourney Admin Console</b><button class="btn btn-outline btn-sm" onclick="go('dashboard')">Back to app</button></div><div class="main"><div class="section-head"><div><h2>Admin Dashboard</h2><p>Manage events and view platform analytics.</p></div><button class="btn btn-primary" onclick="addCustomEvent()">Add Life Event</button></div><div class="stats"><div class="stat"><b>${EVENTS.length}</b><span>Life Events</span></div><div class="stat"><b>${Object.keys(counts).length}</b><span>Categories</span></div><div class="stat"><b>${js.length}</b><span>Saved Journeys</span></div><div class="stat"><b>${STORE.get('accounts',[]).length}</b><span>Registered Users</span></div></div><div class="grid-2" style="margin-top:20px"><div class="card chart-card"><h3 style="color:var(--navy)">Journeys by Category</h3><canvas id="catChart"></canvas></div><div class="card"><h3 style="color:var(--navy)">Life Event Catalogue</h3><div style="max-height:360px;overflow:auto">${EVENTS.map((e,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${iconSvg(e.icon,e.name)} ${e.name}<small style="color:var(--muted)"> • ${e.category}</small></span><button class="btn btn-danger btn-sm" onclick="removeEvent('${e.id}')">Remove</button></div>`).join('')}</div></div></div></div>`}
function addCustomEvent(){modal(`<div class="modal-head"><h2>Add Life Event</h2><button class="close" onclick="closeModal()">${iconSvg('close','Close')}</button></div><div class="field"><label>Name</label><input class="input" id="ae1"></div><div class="field"><label>Category</label><input class="input" id="ae2" value="Other"></div><div class="field"><label>Icon</label><input class="input" id="ae3" value="documents"></div><div class="field"><label>Description</label><textarea class="textarea" id="ae4"></textarea></div><button class="btn btn-primary" style="width:100%" onclick="saveCustomEvent()">Add Event</button>`)}
function saveCustomEvent(){const n=document.getElementById('ae1').value.trim();if(!n)return toast('Enter event name.');const e={id:'custom-'+Date.now(),name:n,category:document.getElementById('ae2').value||'Other',icon:document.getElementById('ae3').value||'documents',description:document.getElementById('ae4').value||'Custom life event.',duration:'Flexible',documents:['Identity proof','Address proof'],departments:['Relevant Government Department'],portal:['India.gov.in','https://www.india.gov.in/'],questions:['Is this your required life event?','Do you have your identity proof?','Do you need office assistance?','Would you like reminders?'],steps:[{title:'Prepare documents',desc:'Collect the basic supporting documents.',dept:'Relevant Government Department'},{title:'Submit application',desc:'Complete the applicable official process.',dept:'Relevant Government Department'},{title:'Complete verification',desc:'Keep acknowledgement and respond to requests.',dept:'Relevant Government Department'},{title:'Track outcome',desc:'Monitor the official status.',dept:'Relevant Government Department'}]};EVENTS.push(e);if(!CATS.includes(e.category))CATS.push(e.category);closeModal();toast('Life event added');render()}
function removeEvent(id){const i=EVENTS.findIndex(e=>e.id===id);if(i>=0){EVENTS.splice(i,1);toast('Life event removed');render()}}
function how(){return `<div class="page-head"><div class="container"><h1>How GovJourney Works</h1><p>A clear flow from life event to completed government action.</p></div></div><section class="section"><div class="container grid-2"><div class="card"><h2 style="color:var(--navy)">1. Select</h2><p style="color:var(--muted);line-height:1.7">Choose one of the available life events. Search and categories make discovery simple.</p></div><div class="card"><h2 style="color:var(--navy)">2. Personalize</h2><p style="color:var(--muted);line-height:1.7">Answer short questions so the roadmap matches your situation.</p></div><div class="card"><h2 style="color:var(--navy)">3. Follow dependencies</h2><p style="color:var(--muted);line-height:1.7">Important prerequisites unlock the next action in sequence.</p></div><div class="card"><h2 style="color:var(--navy)">4. Track & act</h2><p style="color:var(--muted);line-height:1.7">Use documents, office directions, reminders, notifications and reports.</p></div></div></section>${footer()}`}

function initSeed(){if(!STORE.get('accounts'))STORE.set('accounts',[{name:'Demo Citizen',email:'demo@govjourney.com',mobile:'9900000000',password:'Demo@123'}]);if(!STORE.get('notifications'))STORE.set('notifications',[{icon:'notifications',title:'Welcome to GovJourney',body:'Start a life-event journey to generate your roadmap.',read:false,date:new Date().toISOString()}]);if(!STORE.get('reminders'))STORE.set('reminders',[]);if(!STORE.get('vault'))STORE.set('vault',[])}
function toggleChat(){document.getElementById('chatPanel').classList.toggle('show');if(!document.getElementById('chatBody').children.length)bot('Hi! I can help you find a life event, documents, offices or reminders.')}
function bot(t){document.getElementById('chatBody').insertAdjacentHTML('beforeend',`<div class="msg bot">${t}</div>`);document.getElementById('chatBody').scrollTop=99999}
function usermsg(t){document.getElementById('chatBody').insertAdjacentHTML('beforeend',`<div class="msg user">${t}</div>`)}
async function sendChat(){const i=document.getElementById('chatInput'),t=i.value.trim();if(!t)return;usermsg(t);i.value='';try{const data=await api('/api/chat',{method:'POST',body:JSON.stringify({message:t})});bot(`${data.reply}${data.sources?.length?`<br><small>Source: ${data.sources[0][1]||data.sources[0]}</small>`:''}`)}catch(error){bot('The assistant is temporarily unavailable. Please use Life Events and the linked official portal.')}}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice recognition is not supported in this browser.');const r=new R();r.lang='en-IN';r.onstart=()=>toast('Listening…');r.onresult=e=>{const t=e.results[0][0].transcript;toast('Heard: '+t);document.getElementById('chatPanel').classList.add('show');usermsg(t);document.getElementById('chatInput').value=t;sendChat()};r.start()}

let officeMap=null;let officeMarkers=null;let userMarker=null;
function officePopup(item){const name=item.name||item.tags?.name||'Government office';const address=item.address||[item.tags?.['addr:street'],item.tags?.['addr:city'],item.tags?.['addr:state']].filter(Boolean).join(', ')||'Karnataka';const lat=item.lat??item.center?.lat;const lon=item.lon??item.center?.lon;return `<b>${name}</b><br><small>${address}</small><br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}">Get directions</a>`}
function officePoint(item){return [item.lat??item.center?.lat,item.lon??item.center?.lon]}
function showOfficeMarkers(items){if(!officeMap)return;if(officeMarkers)officeMarkers.clearLayers();officeMarkers=L.layerGroup();items.filter(item=>officePoint(item).every(Boolean)).forEach(item=>{const point=officePoint(item);L.marker(point).bindPopup(officePopup(item)).addTo(officeMarkers)});officeMarkers.addTo(officeMap);renderOfficeResults(items)}
function renderOfficeResults(items){const target=document.getElementById('officeResults');if(!target)return;target.innerHTML=items.slice(0,12).map(item=>{const point=officePoint(item);const name=item.name||item.tags?.name||'Government office';const address=item.address||[item.tags?.['addr:street'],item.tags?.['addr:city'],item.tags?.['addr:state']].filter(Boolean).join(', ')||'Karnataka';return `<div class="office-result"><div><b>${name}</b><small>${address}</small></div><a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${point[0]},${point[1]}">Directions</a></div>`}).join('')||'<div class="empty card">No offices found. Try a district or department name.</div>'}
async function loadNearbyOffices(){const status=document.getElementById('mapStatus');if(!officeMap)return;status.textContent='Loading live government offices from OpenStreetMap…';const bounds=officeMap.getBounds();const south=bounds.getSouth(),west=bounds.getWest(),north=bounds.getNorth(),east=bounds.getEast();const baseline=KARNATAKA_OFFICE_POINTS.filter(item=>item.lat>=south&&item.lat<=north&&item.lon>=west&&item.lon<=east);const query=`[out:json][timeout:20];(nwr["office"="government"](${south},${west},${north},${east});nwr["amenity"="townhall"](${south},${west},${north},${east});nwr["government"](${south},${west},${north},${east}););out center tags;`;try{const response=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query));if(!response.ok)throw new Error('Map data unavailable');const data=await response.json();const items=data.elements.map(item=>({ ...item,name:item.tags?.name||item.tags?.office||'Government office',address:[item.tags?.['addr:street'],item.tags?.['addr:city'],item.tags?.['addr:state']].filter(Boolean).join(', ')}));const combined=[...baseline,...items];showOfficeMarkers(combined);status.textContent=`${combined.length} offices shown, including live OpenStreetMap results.`}catch(error){showOfficeMarkers(baseline);status.textContent=`Showing ${baseline.length} Karnataka government office locations. Live map data is temporarily unavailable.`}}
function locateOfficeUser(){if(!navigator.geolocation)return toast('Location is not available in this browser.');const status=document.getElementById('mapStatus');status.textContent='Requesting your location…';navigator.geolocation.getCurrentPosition(position=>{const point=[position.coords.latitude,position.coords.longitude];officeMap.setView(point,14);if(userMarker)userMarker.remove();userMarker=L.circleMarker(point,{radius:9,color:'#f33b24',fillColor:'#f33b24',fillOpacity:.9}).addTo(officeMap).bindPopup('Your approximate location').openPopup();loadNearbyOffices()},()=>{status.textContent='Location permission was not granted. Showing Bengaluru by default.'})}
async function searchOffices(){const input=document.getElementById('officeSearch');const query=input.value.trim()||'government office Karnataka';const status=document.getElementById('mapStatus');status.textContent='Searching live place data…';try{const response=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=12&countrycodes=in&state=Karnataka&q=${encodeURIComponent(query)}`,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error('Search unavailable');const results=await response.json();const items=results.map(result=>({lat:Number(result.lat),lon:Number(result.lon),name:result.display_name.split(',')[0],address:result.display_name}));showOfficeMarkers(items);if(items[0])officeMap.setView([items[0].lat,items[0].lon],14);status.textContent=`${items.length} live places found.`}catch(error){status.textContent='Search is temporarily unavailable. Please try again.'}}
function offices(){const html=`<div class="section-head"><div><h2>Karnataka Office Locator</h2><p>Locate nearby government offices using free, live OpenStreetMap data.</p></div></div><div class="notice">Map data is provided by OpenStreetMap contributors. Use the official department portal to confirm office timings and service requirements.</div><div class="map-tools" style="margin:16px 0"><input class="input" id="officeSearch" placeholder="Search BBMP, RTO, Bengaluru, Mysuru…" onkeydown="if(event.key==='Enter')searchOffices()"><button class="btn btn-primary" onclick="searchOffices()">Search</button><button class="btn btn-outline" onclick="locateOfficeUser()">Use my location</button></div><div id="mapStatus" class="map-status">Showing live government offices around Bengaluru. You can search any Karnataka district.</div><div id="officeMap" class="office-map"></div><div id="officeResults" class="office-results"></div>`;setTimeout(initOfficeMap,0);return html}
function initOfficeMap(){const target=document.getElementById('officeMap');if(!target||!window.L)return;officeMap=L.map(target).setView([12.9716,77.5946],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(officeMap);officeMap.on('moveend',()=>loadNearbyOffices());loadNearbyOffices()}
function appShell(content,active){const items=[['home','dashboard','Home'],['dashboard','dashboard','Dashboard'],['events','events','Karnataka Services'],['journeys','journeys','My Journeys'],['documents','documents','Documents'],['offices','offices','Office Locator'],['notifications','notifications','Notifications'],['reminders','reminders','Reminders'],['profile','profile','Profile']];return `<div class="app-layout"><aside class="side"><h4>Workspace</h4>${items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')">${iconSvg(x[1],x[2])} <span>${x[2]}</span></button>`).join('')}<h4>Administration</h4><button onclick="go('admin')">${iconSvg('admin','Admin Console')} Admin Console</button><button onclick="logout()">${iconSvg('close','Log out')} Log out</button></aside><section class="main">${content}</section></div>`}
function openDigiLocker(){window.open('https://www.digilocker.gov.in/','_blank','noopener,noreferrer')}
async function connectDigiLocker(){if(!S.user){openLogin();return}try{const status=await api('/api/digilocker/status');if(status.configured){const data=await api('/api/digilocker/connect');window.location.href=data.url;return}}catch(error){}toast('Opening the official DigiLocker website.');openDigiLocker()}
async function syncDigiLocker(){try{await api('/api/digilocker/documents');toast('DigiLocker documents synced')}catch(error){toast(error.message)}}
function documents(){return `<div class="section-head"><div><h2>DigiLocker Documents</h2><p>Use your official DigiLocker account for issued certificates and verified documents.</p></div><button class="btn btn-primary" onclick="connectDigiLocker()">Connect DigiLocker</button></div><div class="notice"><b>Your documents stay with DigiLocker.</b> GovJourney does not ask you to upload Aadhaar, PAN, certificates or other sensitive records into this prototype.</div><div class="grid-2" style="margin-top:18px"><div class="card"><div class="event-icon" style="background:#eaf2ff;color:#2563eb">${iconSvg('documents','DigiLocker')}</div><h3 style="color:var(--navy)">Open DigiLocker</h3><p style="color:var(--muted);line-height:1.7">Sign in to DigiLocker to view and share documents issued by participating departments, universities and transport authorities.</p><button class="btn btn-primary" onclick="openDigiLocker()">Open Official DigiLocker</button></div><div class="card"><h3 style="color:var(--navy)">DigiLocker connection</h3><p style="color:var(--muted);line-height:1.7">When approved DigiLocker partner credentials are configured, GovJourney can start the official OAuth connection without storing your DigiLocker password.</p><button class="btn btn-outline" onclick="syncDigiLocker()">Check Sync Status</button><p style="font-size:12px;color:var(--muted);margin-top:14px">Never share your DigiLocker OTP or password with anyone.</p></div></div><section class="section" style="padding:28px 0 0"><div class="card"><h3 style="color:var(--navy)">Useful Karnataka document sources</h3><div class="grid-2"><a class="btn btn-outline" href="https://sevasindhu.karnataka.gov.in/" target="_blank" rel="noopener">Seva Sindhu</a><a class="btn btn-outline" href="https://parivahan.gov.in/" target="_blank" rel="noopener">Parivahan Services</a><a class="btn btn-outline" href="https://www.karnataka.gov.in/" target="_blank" rel="noopener">Karnataka Government</a><a class="btn btn-outline" href="https://www.digilocker.gov.in/" target="_blank" rel="noopener">DigiLocker</a></div></div></section>`}
function documents(){return `<div class="section-head"><div><h2>DigiLocker Documents</h2><p>Access your official issued documents through DigiLocker.</p></div><button class="btn btn-primary" onclick="openDigiLocker()">Open DigiLocker</button></div><div class="notice"><b>Official access only.</b> GovJourney does not fetch or store DigiLocker documents because this prototype is not a registered DigiLocker partner. Sign in directly on DigiLocker to view your documents.</div><div class="grid-2" style="margin-top:18px"><div class="card"><div class="event-icon" style="background:#eaf2ff;color:#2563eb">${iconSvg('documents','DigiLocker')}</div><h3 style="color:var(--navy)">Your DigiLocker account</h3><p style="color:var(--muted);line-height:1.7">Use the single button above to open DigiLocker and access issued certificates, driving records, education documents and other participating services.</p></div><div class="card"><h3 style="color:var(--navy)">How it works with GovJourney</h3><p style="color:var(--muted);line-height:1.7">Open DigiLocker in a new tab, find the document you need, then return here to continue your Karnataka service checklist. No DigiLocker password or OTP is handled by GovJourney.</p><p style="font-size:12px;color:var(--muted);margin-top:14px">Never share your DigiLocker OTP or password with anyone.</p></div></div><section class="section" style="padding:28px 0 0"><div class="card"><h3 style="color:var(--navy)">Karnataka document sources</h3><div class="grid-2"><a class="btn btn-outline" href="https://sevasindhu.karnataka.gov.in/" target="_blank" rel="noopener">Seva Sindhu</a><a class="btn btn-outline" href="https://parivahan.gov.in/" target="_blank" rel="noopener">Parivahan Services</a><a class="btn btn-outline" href="https://www.karnataka.gov.in/" target="_blank" rel="noopener">Karnataka Government</a><a class="btn btn-outline" href="https://www.digilocker.gov.in/" target="_blank" rel="noopener">DigiLocker</a></div></div></section>`}
function reminderStatus(item){if(item.completed)return {label:'Completed',className:'completed'};const today=new Date();today.setHours(0,0,0,0);const due=new Date(`${item.due}T00:00:00`);const days=Math.ceil((due-today)/86400000);if(days<0)return {label:`Overdue by ${Math.abs(days)} day${Math.abs(days)===1?'':'s'}`,className:'overdue'};if(days===0)return {label:'Due today',className:'today'};if(days===1)return {label:'Due tomorrow',className:'today'};return {label:`Due in ${days} days`,className:''}}
function toggleReminderDone(id){const list=reminders();const item=list.find(reminder=>reminder.id===id);if(item){item.completed=!item.completed;STORE.set('reminders',list);render()}}
function remindersPage(){const list=reminders().slice().sort((a,b)=>new Date(a.due)-new Date(b.due));const open=list.filter(item=>!item.completed).length;const overdue=list.filter(item=>reminderStatus(item).className==='overdue').length;const today=new Date().toISOString().slice(0,10);return `<div class="section-head"><div><h2>Reminders & Calendar</h2><p>Keep Karnataka service deadlines, appointments and follow-ups in one place.</p></div><button class="btn btn-primary" onclick="document.getElementById('rt').focus()">Add reminder</button></div><div class="stats"><div class="stat"><b>${open}</b><span>Open reminders</span></div><div class="stat"><b>${overdue}</b><span>Overdue</span></div><div class="stat"><b>${list.filter(item=>item.due===today&&!item.completed).length}</b><span>Due today</span></div><div class="stat"><b>${list.filter(item=>item.completed).length}</b><span>Completed</span></div></div><div class="grid-2" style="margin-top:20px"><div class="card"><h3 style="color:var(--navy)">Create a reminder</h3><p style="color:var(--muted);font-size:13px">Use reminders for appointments, document renewals, Sakala follow-ups and office visits.</p><div class="field"><label>Reminder title</label><input class="input" id="rt" placeholder="Passport appointment"></div><div class="field"><label>Due date</label><input class="input" type="date" id="rd" min="${today}"></div><div class="field"><label>Notes</label><textarea class="textarea" id="rn2" rows="3" placeholder="Bring original documents"></textarea></div><button class="btn btn-primary" onclick="addReminder()">Save reminder</button></div><div><h3 style="color:var(--navy);margin-top:0">Your schedule</h3>${list.length?list.map(item=>{const status=reminderStatus(item);return `<div class="reminder-card ${status.className}"><div><h4>${item.title}</h4><p><b>${item.due}</b> • ${status.label}${item.notes?' • '+item.notes:''}</p></div><div class="reminder-actions"><button class="btn btn-outline btn-sm" onclick="toggleReminderDone(${item.id})">${item.completed?'Reopen':'Complete'}</button><button class="btn btn-outline btn-sm" onclick="calendar('${item.title.replace(/'/g,'')}','${item.due}','${(item.notes||'').replace(/'/g,'')}')">Calendar</button><button class="btn btn-danger btn-sm" onclick="deleteReminder(${item.id})">Delete</button></div></div>`}).join(''):'<div class="empty card">No reminders yet. Add your first service deadline.</div>'}</div></div>`}
function filterAdminCatalogue(query){const value=query.toLowerCase();document.querySelectorAll('[data-admin-event]').forEach(row=>row.classList.toggle('hidden',!row.dataset.adminEvent.includes(value)))}
function exportAdminSummary(){const rows=EVENTS.map(event=>`${event.name},${event.category},${event.duration}`).join('\n');const file=`GovJourney Karnataka service catalogue\n\nService,Category,Typical duration\n${rows}`;const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([file],{type:'text/csv'}));link.download='govjourney-karnataka-catalogue.csv';link.click();toast('Catalogue exported')}
function adminPage(){const js=journeys(),counts={};EVENTS.forEach(event=>counts[event.category]=0);js.forEach(journey=>{const event=ev(journey.eventId);if(event)counts[event.category]++});const active=js.filter(journey=>journey.status==='active').length;const completed=js.filter(journey=>journey.status==='completed').length;return `<div class="admin-hero"><h1>GovJourney Karnataka operations</h1><p>Manage the service catalogue, monitor citizen journeys and keep official routes reviewable.</p></div><div class="section-head"><div><h2>Admin Console</h2><p>Prototype operations view for Karnataka service navigation.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline" onclick="exportAdminSummary()">Export catalogue</button><button class="btn btn-primary" onclick="addCustomEvent()">Add service</button></div></div><div class="stats"><div class="stat"><b>${EVENTS.length}</b><span>Services</span></div><div class="stat"><b>${Object.keys(counts).length}</b><span>Categories</span></div><div class="stat"><b>${active}</b><span>Active journeys</span></div><div class="stat"><b>${completed}</b><span>Completed journeys</span></div></div><div class="grid-2" style="margin-top:20px"><div class="card"><h3 style="color:var(--navy)">Platform health</h3><div class="health-row"><span><i class="status-dot"></i>Frontend catalogue</span><b>Ready</b></div><div class="health-row"><span><i class="status-dot"></i>Journey API</span><b>${STORE.get('token','')?'Connected':'Demo mode'}</b></div><div class="health-row"><span><i class="status-dot"></i>Official links</span><b>Review before launch</b></div><div class="health-row"><span><i class="status-dot"></i>Content verification</span><b>Required</b></div></div><div class="card"><h3 style="color:var(--navy)">Journey coverage</h3>${Object.entries(counts).map(([category,count])=>`<div class="health-row"><span>${category}</span><b>${count} journeys</b></div>`).join('')}</div></div><div class="card" style="margin-top:20px"><div class="section-head" style="margin-bottom:12px"><div><h3 style="color:var(--navy);margin:0">Karnataka service catalogue</h3><p style="margin:4px 0 0">Search, review and remove local prototype entries.</p></div></div><div class="admin-toolbar"><input class="input" placeholder="Search service or category..." oninput="filterAdminCatalogue(this.value)"></div><div style="max-height:430px;overflow:auto">${EVENTS.map(event=>`<div data-admin-event="${(`${event.name} ${event.category}`).toLowerCase()}" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)"><span>${iconSvg(event.icon,event.name)} <b>${event.name}</b><small style="color:var(--muted)"> • ${event.category} • ${event.duration}</small></span><button class="btn btn-danger btn-sm" onclick="removeEvent('${event.id}')">Remove</button></div>`).join('')}</div></div>`}
function dashboard(){const list=journeys(),active=list.filter(item=>item.status==='active'),completed=list.filter(item=>item.status==='completed'),unread=STORE.get('notifications',[]).filter(item=>!item.read).length;return `<div class="section-head"><div><h2>Good day, ${S.user?.name?.split(' ')[0]||'Citizen'}</h2><p>Your Karnataka government action plan in one place.</p></div><button class="btn btn-primary" onclick="go('events')">New Journey</button></div><div class="stats"><div class="stat"><b>${active.length}</b><span>Active journeys</span></div><div class="stat"><b>${completed.length}</b><span>Completed journeys</span></div><div class="stat"><b>${unread}</b><span>Unread notifications</span></div><div class="stat"><b>${EVENTS.length}</b><span>Karnataka services</span></div></div><h3 style="color:var(--navy);margin-top:28px">Continue your journeys</h3>${active.length?active.map(item=>{const event=ev(item.eventId);return `<div class="journey-card"><div style="display:flex;gap:12px;align-items:center"><span class="event-icon" style="width:44px;height:44px;background:${event.color}18">${iconSvg(event.icon,event.name)}</span><div><span class="badge current">Active</span><h3 style="margin:7px 0;color:var(--navy)">${event.name}</h3><p style="margin:0;color:var(--muted);font-size:13px">${item.completed.length}/${event.steps.length} steps complete</p></div></div><div><div class="track"><div class="fill" style="width:${pct(item,event)}%"></div></div><button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="go('journey',{id:'${event.id}'})">Continue</button></div></div>`}).join(''):'<div class="empty card">No active journeys yet. Start one from Karnataka Services.</div>'}<h3 style="color:var(--navy);margin-top:28px">Quick access</h3><div class="feature-grid"><div class="card feature" onclick="go('documents')">${iconSvg('documents','Documents')} <b>Documents</b><p style="color:var(--muted)">DigiLocker access</p></div><div class="card feature" onclick="go('offices')">${iconSvg('offices','Office Locator')} <b>Office Locator</b><p style="color:var(--muted)">Karnataka offices</p></div><div class="card feature" onclick="go('reminders')">${iconSvg('reminders','Reminders')} <b>Reminders</b><p style="color:var(--muted)">Deadlines and calendar</p></div><div class="card feature" onclick="go('notifications')">${iconSvg('notifications','Notifications')} <b>Notifications</b><p style="color:var(--muted)">${unread} unread</p></div></div>`}
function myJourneys(){const list=journeys();return `<div class="section-head"><div><h2>My Journeys</h2><p>All your saved Karnataka service roadmaps.</p></div><button class="btn btn-primary" onclick="go('events')">New Journey</button></div>${list.length?list.map(item=>{const event=ev(item.eventId);if(!event)return '';return `<div class="journey-card"><div style="display:flex;gap:12px;align-items:center"><span class="event-icon" style="width:44px;height:44px;background:${event.color}18">${iconSvg(event.icon,event.name)}</span><div><span class="badge ${item.status==='completed'?'done':'current'}">${item.status}</span><h3 style="margin:7px 0;color:var(--navy)">${event.name}</h3><p style="margin:0;color:var(--muted);font-size:13px">Started ${new Date(item.started).toLocaleDateString()}</p></div></div><div><div class="track"><div class="fill" style="width:${pct(item,event)}%"></div></div><button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="go('journey',{id:'${event.id}'})">View Journey</button></div></div>`}).join(''):'<div class="empty card">No journeys saved yet. Start one from Karnataka Services.</div>'}`}

function applyTranslations(){const language=activeLanguage();if(language==='en')return;const index=language==='hi'?0:1;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{if(node.parentElement?.closest('#lang,[data-no-translate]'))return;const value=node.nodeValue.trim();if(TRANSLATIONS[value])node.nodeValue=node.nodeValue.replace(value,TRANSLATIONS[value][index])});document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(input=>{if(input.closest('[data-no-translate]'))return;const value=input.getAttribute('placeholder');if(TRANSLATIONS[value])input.setAttribute('placeholder',TRANSLATIONS[value][index])});}

const EVENT_DESCRIPTION_KN={'marriage':'ವಿವಾಹವನ್ನು ನೋಂದಾಯಿಸಿ ಮತ್ತು ಗುರುತು, ವಿಳಾಸ ಹಾಗೂ ಸಂಬಂಧಿತ ಸರ್ಕಾರಿ ದಾಖಲೆಗಳನ್ನು ನವೀಕರಿಸಿ.','child-birth':'ಜನನ ನೋಂದಣಿ, ಪ್ರಮಾಣಪತ್ರಗಳು, ಗುರುತು ನವೀಕರಣಗಳು ಮತ್ತು ಕುಟುಂಬ ಸೌಲಭ್ಯಗಳನ್ನು ಯೋಜಿಸಿ.','buy-house':'ಆಸ್ತಿ ಖರೀದಿ, ನೋಂದಣಿ, ತೆರಿಗೆ ಮತ್ತು ಮಾಲೀಕತ್ವದ ದಾಖಲೆಗಳನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','rent-house':'ಬಾಡಿಗೆ ದಾಖಲೆಗಳು, ವಿಳಾಸ ಪುರಾವೆ ಮತ್ತು ಸೇವಾ ನವೀಕರಣಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಿ.','start-business':'ವ್ಯಾಪಾರ ನೋಂದಣಿ, ತೆರಿಗೆ ಮತ್ತು ಸ್ಥಳೀಯ ಅನುಮತಿಗಳಿಗಾಗಿ ಮಾರ್ಗದರ್ಶಿ ಪಡೆಯಿರಿ.','close-business':'ವ್ಯಾಪಾರ ಮುಚ್ಚುವಿಕೆ, ತೆರಿಗೆ, ಪರವಾನಗಿ ಮತ್ತು ಖಾತೆ ಸಂಬಂಧಿತ ಕ್ರಮಗಳನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','new-job':'ಉದ್ಯೋಗ ದಾಖಲೆಗಳು, ತೆರಿಗೆ, ಸಾಮಾಜಿಕ ಭದ್ರತೆ ಮತ್ತು ವಿಳಾಸ ನವೀಕರಣಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಿ.','retirement':'ಪಿಂಚಣಿ, EPF, ವಿಮೆ ಮತ್ತು ಗುರುತು ಸಂಬಂಧಿತ ಕ್ರಮಗಳನ್ನು ಯೋಜಿಸಿ.','address-change':'ಗುರುತು, ತೆರಿಗೆ, ವಾಹನ ಮತ್ತು ಸೇವಾ ದಾಖಲೆಗಳಲ್ಲಿ ವಿಳಾಸವನ್ನು ನವೀಕರಿಸಿ.','name-change':'ಅಫಿಡವಿಟ್, ಗೆಜೆಟ್ ಮತ್ತು ನಂತರದ ಗುರುತು ನವೀಕರಣಗಳನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','passport':'ಪಾಸ್‌ಪೋರ್ಟ್ ಅರ್ಜಿಗಳು, ನವೀಕರಣಗಳು ಮತ್ತು ಪೂರಕ ದಾಖಲೆಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಿ.','vehicle':'ವಾಹನ ನೋಂದಣಿ, ವಿಮೆ ಮತ್ತು ಮಾಲೀಕತ್ವದ ದಾಖಲೆಗಳನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','sell-vehicle':'ಮಾಲೀಕತ್ವ ವರ್ಗಾವಣೆ, ವಿಮೆ ಮತ್ತು ಹಸ್ತಾಂತರ ದಾಖಲೆಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಿ.','education':'ಪ್ರವೇಶ, ಪ್ರಮಾಣಪತ್ರಗಳು, ಶುಲ್ಕ ಮತ್ತು ವಿದ್ಯಾರ್ಥಿವೇತನ ಕ್ರಮಗಳನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','pension':'ಅರ್ಹ ಪಿಂಚಣಿ ಅಥವಾ ಕಲ್ಯಾಣ ಸೌಲಭ್ಯಗಳ ಅರ್ಜಿಗಳನ್ನು ಹುಡುಕಿ ಮತ್ತು ಸಿದ್ಧಪಡಿಸಿ.','health':'ಆರೋಗ್ಯ ಯೋಜನೆ, ಪ್ರಮಾಣಪತ್ರ ಮತ್ತು ಸೇವಾ ಪ್ರವೇಶದ ಮಾಹಿತಿಯನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','voter':'ಜೀವನ ಬದಲಾವಣೆಯ ನಂತರ ಮತದಾರರ ಮಾಹಿತಿಯನ್ನು ನೋಂದಾಯಿಸಿ ಅಥವಾ ನವೀಕರಿಸಿ.','income-tax':'PAN, ತೆರಿಗೆ ಪ್ರೊಫೈಲ್, ಕಡಿತಗಳು ಮತ್ತು ರಿಟರ್ನ್ ಸಂಬಂಧಿತ ಕ್ರಮಗಳನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','banking':'ಜೀವನ ಬದಲಾವಣೆಯ ನಂತರ ವಿಳಾಸ, KYC, ನಾಮನಿರ್ದೇಶಿತರು ಮತ್ತು ಖಾತೆ ನವೀಕರಣಗಳನ್ನು ನಿರ್ವಹಿಸಿ.','digital-docs':'ಪ್ರಮುಖ ದಾಖಲೆಗಳ ಪ್ರತಿಗಳನ್ನು ವೈಯಕ್ತಿಕ ಪಟ್ಟಿಯಲ್ಲಿ ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.','senior-support':'ಹಿರಿಯ ನಾಗರಿಕರ ಪ್ರಮಾಣಪತ್ರಗಳು, ಕಲ್ಯಾಣ ಯೋಜನೆಗಳು ಮತ್ತು ನೆರವನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿ.'};
const EVENT_DESCRIPTION_HI={'marriage':'विवाह पंजीकरण करें और पहचान, पता तथा संबंधित सरकारी रिकॉर्ड अपडेट करें।','child-birth':'जन्म पंजीकरण, प्रमाणपत्र, पहचान अपडेट और पारिवारिक लाभ की योजना बनाएँ।','buy-house':'संपत्ति खरीद, पंजीकरण, कर और स्वामित्व दस्तावेज़ व्यवस्थित करें।','rent-house':'किराये के दस्तावेज़, पते के प्रमाण और सेवा अपडेट तैयार करें।','start-business':'व्यवसाय पंजीकरण, कर और स्थानीय अनुमतियों की चेकलिस्ट बनाएँ।','close-business':'व्यवसाय बंद करने, कर, लाइसेंस और खाते से जुड़े कार्य व्यवस्थित करें।','new-job':'नौकरी के दस्तावेज़, कर, सामाजिक सुरक्षा और पते के अपडेट तैयार करें।','retirement':'पेंशन, EPF, बीमा और पहचान से जुड़े कार्यों की योजना बनाएँ।','address-change':'पहचान, कर, वाहन और सेवा रिकॉर्ड में पता अपडेट करें।','name-change':'शपथपत्र, राजपत्र और आगे के पहचान अपडेट व्यवस्थित करें।','passport':'पासपोर्ट आवेदन, अपडेट और सहायक दस्तावेज़ तैयार करें।','vehicle':'वाहन पंजीकरण, बीमा और स्वामित्व दस्तावेज़ व्यवस्थित करें।','sell-vehicle':'स्वामित्व हस्तांतरण, बीमा और वाहन सौंपने के दस्तावेज़ तैयार करें।','education':'प्रवेश, प्रमाणपत्र, शुल्क और छात्रवृत्ति संबंधी कार्य व्यवस्थित करें।','pension':'पात्र पेंशन या कल्याण लाभ आवेदनों को खोजें और तैयार करें।','health':'स्वास्थ्य योजना, प्रमाणपत्र और सेवा-प्राप्ति की जानकारी व्यवस्थित करें।','voter':'जीवन परिवर्तन के बाद मतदाता जानकारी पंजीकृत या अपडेट करें।','income-tax':'PAN, कर प्रोफ़ाइल, कटौतियों और रिटर्न से जुड़े कार्य व्यवस्थित करें।','banking':'जीवन परिवर्तन के बाद पता, KYC, नामांकित व्यक्ति और खाता अपडेट प्रबंधित करें।','digital-docs':'महत्वपूर्ण दस्तावेज़ों की प्रतियों को अपनी व्यक्तिगत सूची में व्यवस्थित करें।','senior-support':'वरिष्ठ नागरिक प्रमाणपत्र, कल्याण योजनाएँ और सहायता व्यवस्थित करें।'};
function localizedEvent(id){const base=EVENTS.find(event=>event.id===id);if(!base)return base;const language=activeLanguage();const copy=EVENT_TRANSLATIONS[id]?.[language];const name=copy?.name||EVENT_NAME_TRANSLATIONS[id]?.[language==='hi'?0:1]||base.name;const descriptions={hi:EVENT_DESCRIPTION_HI,kn:EVENT_DESCRIPTION_KN};const description=copy?.description||descriptions[language]?.[id]||base.description;if(!copy)return {...base,name,description};return {...base,name,description,steps:base.steps.map((step,index)=>({...step,title:copy.steps[index]||step.title}))}}
function localizedCategory(category){const language=activeLanguage();return CATEGORY_TRANSLATIONS[category]?.[language==='hi'?0:1]||category}
function ev(id){return localizedEvent(id)}
function localizedDuration(duration,language){if(language==='en')return duration;if(duration==='Ongoing')return language==='hi'?'निरंतर':'ನಿರಂತರ';return duration.replace('weeks',CARD_UI_TRANSLATIONS.week[language==='hi'?0:1])}
function eventCard(e){const image=serviceImage(e);return `<div class="card event civic-card" data-no-translate><div class="event-image"><img src="${image}" alt="${e.name}" loading="lazy" onerror="this.onerror=null;this.src='${SERVICE_IMAGES['digital-docs']}'"><span class="image-label">${e.category}</span></div><div class="card-body"><h3>${e.name}</h3><p>${e.description}</p><div class="event-meta">${e.steps.length} steps • ${e.duration}</div><button class="btn btn-primary" onclick="startEvent('${e.id}')">Start Service Journey</button></div></div>`}
function setLanguageSelect(){const select=document.getElementById('lang');if(select)select.value=activeLanguage()}
function journeyPage(id){const e=ev(id),j=journeys().find(x=>x.eventId===id);if(!e||!j)return `<div class="empty">Journey not found.</div>`;const p=pct(j,e);return `<section class="section"><div class="container" style="max-width:900px"><div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><span class="badge ${j.status==='completed'?'done':'current'}">${j.status}</span><h1 style="color:var(--navy);margin:8px 0">${iconSvg(e.icon,e.name)} ${e.name}</h1><p style="color:var(--muted)">${e.departments.join(' • ')}</p></div><b style="font-size:28px;color:var(--blue)">${p}%</b></div><div class="progressbar"><div class="fill" style="width:${p}%"></div></div><div class="grid-2" style="margin-top:20px"><div><b>What you need</b><p style="color:var(--muted);font-size:13px;line-height:1.6">${e.documents.join(' • ')}</p></div><div><b>Expected timeline</b><p style="color:var(--muted);font-size:13px;line-height:1.6">${e.duration}. Requirements and timelines can change; verify on the official Karnataka or department portal.</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:17px"><button class="btn btn-outline btn-sm" onclick="report('${id}')">Report</button><button class="btn btn-outline btn-sm" onclick="go('documents')">Documents</button><button class="btn btn-outline btn-sm" onclick="go('offices')">Offices</button><button class="btn btn-outline btn-sm" onclick="go('reminders')">Reminders</button><a class="btn btn-primary btn-sm" href="${e.portal[1]}" target="_blank" rel="noopener">Official Portal</a></div></div><div class="timeline">${e.steps.map((s,i)=>{const done=j.completed.includes(i),locked=i>0&&!j.completed.includes(i-1);return `<div class="step ${done?'done':(!locked?'current':'')}"><div class="step-dot">${done?iconSvg('check','Completed'):locked?iconSvg('lock','Locked'):i+1}</div><h3>${s.title}</h3><p>${s.desc}</p><div style="margin-top:7px;font-size:12px;color:var(--muted)">Department: ${s.dept}</div><div style="margin-top:9px"><span class="badge ${done?'done':locked?'locked':'current'}">${done?iconSvg('check','Completed'):locked?iconSvg('lock','Locked'):'Current'}</span>${!done&&!locked?` <button class="btn btn-primary btn-sm" onclick="completeStep('${id}',${i})" style="margin-left:6px">Mark complete</button>`:''}</div></div>`}).join('')}</div></div></section>`}
function render(){updateNav();const a=document.getElementById('app');let h='';if(S.route==='home')h=home();else if(S.route==='how')h=how();else if(S.route==='about')h=about();else if(S.route==='events')h=eventsPage();else if(S.route==='questions')h=journeyPage(S.activeEvent);else if(S.route==='journey')h=journeyPage(S.id);else if(S.route==='dashboard')h=appShell(dashboard(),'dashboard');else if(S.route==='journeys')h=appShell(myJourneys(),'journeys');else if(S.route==='documents')h=appShell(documents(),'documents');else if(S.route==='offices')h=appShell(offices(),'offices');else if(S.route==='notifications')h=appShell(notifications(),'notifications');else if(S.route==='reminders')h=appShell(remindersPage(),'reminders');else if(S.route==='profile')h=appShell(profile(),'profile');else if(S.route==='admin')h=adminPage();else h=home();a.innerHTML=h;setLanguageSelect();applyTranslations()}
window.addEventListener('online',()=>document.getElementById('offline').classList.add('hidden'));window.addEventListener('offline',()=>document.getElementById('offline').classList.remove('hidden'));
async function boot(){initSeed();const language=activeLanguage();window.GOVJOURNEY_LANGUAGE=language;STORE.set('lang',language);document.documentElement.lang=language;S.user=STORE.get('user',null);render();if(S.user?.id)try{await syncRemoteData();render()}catch(error){}}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=3').then(registration=>registration.update()).catch(()=>{});
</script>
